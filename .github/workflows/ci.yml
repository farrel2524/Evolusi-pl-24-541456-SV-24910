name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          extensions: mbstring, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          extensions: mbstring, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  staging:
    name: Staging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Staging message
        run: echo "Staging environment ready – changes validated by tests."

  production:
    name: Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Echo deployment steps from deploy.sh
        run: |
          echo "=== Production Deployment Steps (from deploy.sh) ==="
          echo "1. php artisan down --retry=60"
          echo "2. git pull origin main"
          echo "3. composer install --no-dev --optimize-autoloader"
          echo "4. php artisan migrate --force"
          echo "5. php artisan config:cache / route:cache / view:cache"
          echo "6. php artisan queue:restart"
          echo "7. php artisan up"
          echo "=== End of deployment steps ==="
